<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website with Auto Pop-up</title>
  <style>
    /* General Page Styling */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 40px;
    }

    /* Pop-up Window Styling */
    dialog {
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      padding: 30px;
      max-width: 400px;
      text-align: center;
    }

    /* Styling the dimmed background overlay */
    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(3px); /* Smoothly blurs the background site */
    }

    /* Customizable Content Styles */
    dialog h2 {
      margin-top: 0;
      color: #333;
    }

    dialog p {
      color: #666;
      line-height: 1.5;
    }

    /* Customizable Button Style */
    .popup-btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .popup-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Main Website Content -->
  <h1>Welcome to My Website</h1>
  <p>This is the main content of your webpage loading in the background.</p>

  <!-- The Pop-up Element -->
  <dialog id="welcomePopup">
    <!-- EDIT YOUR TEXT HERE -->
    <h2>Welcome Guest!</h2>
    <p>This is your customizable text area. You can put announcements, terms, or offers right here.</p>
    
    <!-- EDIT YOUR BUTTON HERE -->
    <button class="popup-btn" onclick="closePopup()">Explore Site</button>
  </dialog>

  <script>
    const popup = document.getElementById('welcomePopup');

    // Automatically trigger the pop-up immediately when the page loads
    window.addEventListener('DOMContentLoaded', () => {
      popup.showModal(); 
    });

    // Function to close the pop-up when the button is clicked
    function closePopup() {
      popup.close();
    }
  </script>

</body>
</html>
